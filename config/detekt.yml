config:
  validation: true

naming:
  FunctionNaming:
    # Composable functions are PascalCase.
    ignoreAnnotated: ['Composable']

complexity:
  LongParameterList:
    ignoreAnnotated: ['Composable']
    constructorThreshold: 10
  LongMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    active: false
  CyclomaticComplexMethod:
    ignoreSimpleWhenEntries: true

style:
  MagicNumber:
    active: false
  WildcardImport:
    active: false
  ReturnCount:
    max: 4
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
