name: CI

# Once per commit: pull requests (their own branches' pushes would only repeat the PR's run) and main after a merge
# (which keeps the Gradle cache that the PR runs read). Also by hand from the Actions tab.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a PR replaces its run; runs on main all finish, since they save the cache.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      # Robolectric fetches its Android images (about 250 MB) into ~/.m2 on first use, outside Gradle's cache. Saved
      # from main only (as setup-gradle does), where every branch and release.yml can read it.
      - name: Robolectric cache key
        id: robolectric
        run: echo "key=$(.github/scripts/robolectric-cache-key.sh)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        id: robolectric-cache
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ steps.robolectric.outputs.key }}

      - name: Style and static checks
        run: ./gradlew ktlintCheck detekt lintDebug

      # Screenshots show the live clock and programme times, so they are recorded and uploaded for review rather than
      # compared pixel-for-pixel against the committed copies.
      - name: Unit, Robolectric and UI tests (records screenshots)
        run: ./gradlew :core:test :app:recordRoborazziDebug koverXmlReport

      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main' && steps.robolectric-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ steps.robolectric.outputs.key }}

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: reports
          retention-days: 7
          path: |
            app/screenshots/
            **/build/reports/
