name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Style and static checks
        run: ./gradlew ktlintCheck detekt lintDebug

      # Screenshots show the live clock and programme times, so they are recorded and uploaded for review rather than
      # compared pixel-for-pixel against the committed copies.
      - name: Unit, Robolectric and UI tests (records screenshots)
        run: ./gradlew :core:test :app:recordRoborazziDebug koverXmlReport

      # Built even when a test fails (the run still fails), so a test APK is there to try.
      - name: Build sideloadable APK
        if: ${{ !cancelled() }}
        run: ./gradlew :app:assembleRelease

      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: MyTVPlayer-apk
          path: app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: reports
          path: |
            app/screenshots/
            **/build/reports/
