name: Plex spike

# Proves the Plex calls the app relies on against a real (throwaway, unclaimed) Plex Media Server: libraries, hubs,
# search, play progress, direct play and the transcoder, first with the spike, then with the app's own client
# (PlexServerTest). Sign-in, Live TV and DVR need a real account and tuner, so the owner runs those parts of
# spikes/plex_spike.py at home. Runs on PRs that touch the spike, the client or this setup.
on:
  pull_request:
    paths:
      - "spikes/**"
      - "!spikes/dv-diagnostics/**" # its own workflow: dv-diagnostics.yml
      - "core/src/*/kotlin/com/biskyt/myplexplayer/core/plex/**"
      - "core/build.gradle.kts"
      - "gradle/libs.versions.toml"
      - ".github/scripts/start-plex.sh"
      - ".github/workflows/plex-spike.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends ffmpeg
      - run: .github/scripts/start-plex.sh "$RUNNER_TEMP/plex"
      - name: Library, hubs, search and progress (S3)
        run: python3 -I spikes/plex_spike.py library --server http://127.0.0.1:32400 --out "$RUNNER_TEMP/spike-out"
      - name: Direct play and the transcoder (S4)
        run: python3 -I spikes/plex_spike.py playback --server http://127.0.0.1:32400 --out "$RUNNER_TEMP/spike-out"
      - name: Report
        if: always()
        run: |
          cat "$RUNNER_TEMP"/spike-out/report-*.md >> "$GITHUB_STEP_SUMMARY"
          ! grep -q FAIL "$RUNNER_TEMP"/spike-out/report-*.md
      - name: The app's Plex client (PlexServerTest)
        if: ${{ !cancelled() }} # also when a spike check failed, to see whether the client fails too
        run: ./gradlew :core:plexServerTest
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: plex-spike
          path: |
            ${{ runner.temp }}/spike-out/sanitised
            ${{ runner.temp }}/spike-out/report-*.md
            core/build/test-results/plexServerTest
            ${{ runner.temp }}/plex/pms.log
            ${{ runner.temp }}/plex/data/Plex Media Server/Logs
