name: Plex spike

# Proves the Plex calls the app relies on against a real (throwaway, unclaimed) Plex Media Server: libraries, hubs,
# search, play progress, direct play and the transcoder. Sign-in, Live TV and DVR need a real account and tuner, so
# the owner runs those parts of spikes/plex_spike.py at home. Runs on PRs that touch the spike or this setup.
on:
  pull_request:
    paths:
      - "spikes/**"
      - ".github/scripts/start-plex.sh"
      - ".github/workflows/plex-spike.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends ffmpeg
      - run: .github/scripts/start-plex.sh "$RUNNER_TEMP/plex"
      - name: Library, hubs, search and progress (S3)
        run: python3 -I spikes/plex_spike.py library --server http://127.0.0.1:32400 --out "$RUNNER_TEMP/spike-out"
      - name: Direct play and the transcoder (S4)
        run: python3 -I spikes/plex_spike.py playback --server http://127.0.0.1:32400 --out "$RUNNER_TEMP/spike-out"
      - name: Report
        if: always()
        run: |
          cat "$RUNNER_TEMP"/spike-out/report-*.md >> "$GITHUB_STEP_SUMMARY"
          ! grep -q FAIL "$RUNNER_TEMP"/spike-out/report-*.md
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: plex-spike
          path: |
            ${{ runner.temp }}/spike-out/sanitised
            ${{ runner.temp }}/spike-out/report-*.md
            ${{ runner.temp }}/plex/pms.log
