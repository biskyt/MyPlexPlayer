name: Spike app

# The spike as a phone app (spikes/android): runs it on an emulator against a real, throwaway Plex Media Server on
# this runner (10.0.2.2 from inside the emulator), so the APK the owner installs is known to work. Runs on PRs that
# change the spike or this set-up, or by hand (which also keeps the APK as an artifact).
on:
  pull_request:
    paths:
      - "spikes/**"
      - ".github/scripts/start-plex.sh"
      - ".github/scripts/start-emulator.sh"
      - ".github/workflows/spike-app.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  on-device:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5

      - name: Let the emulator use hardware acceleration (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends ffmpeg
      - run: .github/scripts/start-plex.sh "$RUNNER_TEMP/plex"

      - name: Build the spike app and its test
        run: ./gradlew -p spikes/android assembleDebug assembleDebugAndroidTest

      - name: Start a phone emulator (Android 14)
        run: .github/scripts/start-emulator.sh 34 google_apis x86_64 pixel_6

      - name: Run the spike on the emulator
        run: ./gradlew -p spikes/android connectedDebugAndroidTest

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: spike-app-reports
          path: |
            spikes/android/app/build/reports/androidTests/
            emulator.log
            ${{ runner.temp }}/plex/pms.log

      - uses: actions/upload-artifact@v6
        if: github.event_name == 'workflow_dispatch' # a test APK only when asked for
        with:
          name: spike-app-apk
          path: spikes/android/app/build/outputs/apk/debug/app-debug.apk
