name: DV diagnostics app

# The Dolby Vision diagnostics app (spikes/dv-diagnostics): its tests, and its device report on an Android TV 10
# emulator (as the owner's TV). Runs on PRs that change it, or by hand, which also keeps both APKs as an artifact.
on:
  pull_request:
    paths:
      - "spikes/dv-diagnostics/**"
      - "gradle/libs.versions.toml" # MyPlexPlayer's Media3, which one build uses
      - ".github/scripts/start-emulator.sh"
      - ".github/workflows/dv-diagnostics.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5

      - name: Let the emulator use hardware acceleration (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build both apps, and test
        run: ./gradlew -p spikes/dv-diagnostics assembleDebug assembleAppDebugAndroidTest assembleNewerDebugAndroidTest testAppDebugUnitTest testNewerDebugUnitTest

      - name: Start an Android TV 10 emulator
        run: .github/scripts/start-emulator.sh 29 android-tv x86

      - name: The device report on the emulator
        run: ./gradlew -p spikes/dv-diagnostics connectedAppDebugAndroidTest connectedNewerDebugAndroidTest

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: dv-diagnostics-reports
          path: |
            spikes/dv-diagnostics/app/build/reports/
            emulator.log

      - uses: actions/upload-artifact@v6
        if: github.event_name == 'workflow_dispatch' # the APKs only when asked for
        with:
          name: dv-diagnostics-apks
          path: spikes/dv-diagnostics/app/build/outputs/apk/*/debug/*.apk
